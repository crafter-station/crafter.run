<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Home OG video</title>
<style>
@font-face { font-family: "Crafter Display"; src: url(/app/fonts/CrafterSansPreview-Medium.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "Crafter Text"; src: url(/app/fonts/CrafterSansTextPreview-Regular.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Crafter Text"; src: url(/app/fonts/CrafterSansTextPreview-Medium.woff2) format("woff2"); font-weight: 600; }
:root { --paper: #f7f6ee; --ink: #272b23; --muted: #686c5e; --accent: #e0bd55; --gold: #8b7134; --wash: #e9edda; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
body { font-family: "Crafter Text", system-ui; color: var(--ink); }
#stage { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
.wash { position: absolute; right: -150px; top: -120px; width: 760px; height: 820px; border-radius: 50%; background: radial-gradient(ellipse at center, var(--wash), var(--paper) 70%); }
svg.contours { position: absolute; inset: 0; }
#content { position: absolute; inset: 0; }
.brand { position: absolute; left: 64px; top: 44px; display: flex; align-items: center; gap: 14px; font-family: "Crafter Display"; font-weight: 500; font-size: 29px; letter-spacing: -.7px; }
.brand svg { width: 42px; height: 42px; color: var(--ink); }
.copy { position: absolute; left: 64px; top: 168px; width: 560px; }
.layer { position: absolute; left: 0; top: 0; width: 560px; }
.eyebrow { font-size: 20px; letter-spacing: 1.7px; text-transform: uppercase; color: var(--muted); }
.title { margin-top: 20px; font-family: "Crafter Display"; font-weight: 500; font-size: 92px; line-height: 1.02; letter-spacing: -2.6px; }
.title em { font-style: normal; color: var(--gold); }
.sub { margin-top: 26px; font-size: 28px; line-height: 1.38; color: var(--muted); width: 520px; }
.sub b { color: var(--ink); font-weight: 600; }
.foot { position: absolute; left: 64px; right: 64px; bottom: 34px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; color: var(--muted); }
.foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 9px; background: var(--accent); margin-right: 10px; vertical-align: middle; }
.deck { position: absolute; left: 690px; top: 150px; width: 430px; height: 269px; }
.card { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 1px 0 rgb(39 43 35 / .08), 0 18px 40px -18px rgb(39 43 35 / .45); transform-origin: 50% 80%; will-change: transform, opacity; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card.mine { background: var(--paper); border: 2px dashed rgb(39 43 35 / .35); box-shadow: none; display: grid; place-items: center; text-align: center; }
.card.mine .plus { font-family: "Crafter Display"; font-size: 64px; line-height: 1; color: var(--gold); }
.card.mine .label { margin-top: 8px; font-family: "Crafter Display"; font-size: 30px; letter-spacing: -.6px; }
.chips { position: absolute; left: 690px; top: 446px; width: 430px; height: 44px; }
.chip { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; height: 44px; white-space: nowrap; }
.chip img { width: 34px; height: 34px; border-radius: 50%; background: var(--wash); }
.chip .name { font-family: "Crafter Display"; font-weight: 500; font-size: 26px; letter-spacing: -.4px; }
.chip .handle { font-size: 20px; color: var(--muted); }
.chip .pin { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--ink); font-family: "Crafter Display"; font-size: 22px; }
</style>
</head>
<body>
<div id="stage">
  <div class="wash"></div>
  <svg class="contours" width="1200" height="630" viewBox="0 0 1200 630" fill="none" id="contours"></svg>
  <div id="content">
    <div class="brand"><svg viewBox="0 0 257 257" fill="none"><path fill="currentColor" d="M116.419 16.3268C109.59 11.5679 97.9222 5.96914 90.2388 3.72965C72.8798 -1.58913 59.1794 1.40491 50.114 4.56947C32.4704 10.7281 21.3721 18.8462 11.412 33.6828C-4.23949 56.6375 -1.96292 93.869 17.1035 114.864C21.3721 119.903 23.6487 119.063 40.1539 107.026C40.723 106.466 38.4465 102.827 35.0316 98.6278C27.3481 89.11 22.7949 71.754 25.0715 61.9563C32.4704 31.1634 70.3187 14.6472 94.7919 31.4433C100.199 35.0825 117.273 50.199 132.64 65.0356C155.691 86.8706 162.52 91.9094 168.212 91.3496C173.903 90.7897 175.895 88.8301 176.464 82.6715C177.318 75.9531 174.757 72.034 161.667 60.2767C152.845 52.1585 145.731 44.8802 145.731 43.4805C145.731 42.3608 151.707 37.6019 159.105 33.1229C206.914 3.1698 258.421 62.7961 218.581 101.987C213.459 107.026 204.353 112.345 198.377 114.024C191.547 115.704 159.959 117.104 120.688 117.104C47.2683 117.104 43.2842 117.943 23.9332 135.02C-0.824636 157.134 -6.51609 194.926 10.8429 222.359C33.3241 258.191 81.7016 267.149 115.85 241.675L128.372 232.157L142.885 241.675C166.504 257.351 185.571 260.431 208.621 252.872C254.722 237.476 271.796 179.809 241.916 141.178C238.501 136.979 236.794 136.699 232.241 138.939C218.297 146.777 218.581 146.217 226.834 163.013C233.094 175.89 234.233 180.929 232.81 190.727C228.826 215.361 210.044 231.877 186.14 231.877C167.643 231.877 161.667 228.238 127.518 195.486C109.59 178.689 93.0845 164.693 90.8079 164.693C86.5393 164.693 77.433 173.371 77.433 177.57C77.433 178.689 85.1165 187.647 94.7919 197.165L112.151 214.241L101.906 222.08C65.7655 249.233 14.2578 216.761 26.2098 174.211C29.9093 161.333 42.9996 147.057 55.5209 142.578C60.3586 140.618 90.2388 139.498 130.648 139.498C204.922 139.498 213.744 138.099 230.818 123.542C281.757 80.9919 252.161 0.930299 185.571 1.21023C166.22 1.21023 155.691 5.12933 137.762 18.2863L128.656 25.0048L116.419 16.3268Z"/></svg>crafter station</div>
    <div class="copy">
      <div class="layer" id="intro">
        <div class="eyebrow" id="eyebrow"></div>
        <div class="title" id="title"></div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="layer" id="outro">
        <div class="eyebrow" id="eyebrow2"></div>
        <div class="title" id="title2"></div>
        <div class="sub" id="sub2"></div>
      </div>
    </div>
    <div class="deck" id="deck"></div>
    <div class="chips" id="chips"></div>
    <div class="foot"><span><span class="dot"></span>crafter.run</span><span id="footRight"></span></div>
  </div>
</div>
<script src="/.og-video/data.js"></script>
<script>
const COPY = {
  es: {
    eyebrow: "Hecho por la comunidad",
    title: "Craft. Ship.<br><em>Repeat.</em>",
    sub: (n) => `<b>${n} proyectos</b> de builders de LATAM, publicados en crafter.run.`,
    eyebrow2: "Tu turno",
    title2: "¿Y el<br><em>tuyo?</em>",
    sub2: "Pega el enlace y publícalo en minutos.",
    mine: "Tu Ship",
    foot: "crafter.run/ships",
  },
  en: {
    eyebrow: "Made by the community",
    title: "Craft. Ship.<br><em>Repeat.</em>",
    sub: (n) => `<b>${n} projects</b> by LATAM builders, published on crafter.run.`,
    eyebrow2: "Your turn",
    title2: "What are<br><em>you building?</em>",
    sub2: "Paste the link and publish it in minutes.",
    mine: "Your Ship",
    foot: "crafter.run/ships",
  },
}
const params = new URLSearchParams(location.search)
const lang = params.get("lang") === "en" ? "en" : "es"
const c = COPY[lang]
document.documentElement.lang = lang
const { ships, total } = window.DATA

// Contour lines from the static OG card, so the poster matches the brand.
document.getElementById("contours").innerHTML = Array.from({ length: 12 }, (_, i) =>
  `<path d="M${650 + i * 20} -80 C ${1030 + i * 10} 125, ${480 + i * 28} 395, ${860 + i * 30} 710" stroke="#272b23" stroke-width=".8" opacity=".15"/>`).join("")

document.getElementById("eyebrow").textContent = c.eyebrow
document.getElementById("title").innerHTML = c.title
document.getElementById("sub").innerHTML = c.sub(total)
document.getElementById("eyebrow2").textContent = c.eyebrow2
document.getElementById("title2").innerHTML = c.title2
document.getElementById("sub2").textContent = c.sub2
document.getElementById("footRight").textContent = c.foot

const deck = document.getElementById("deck")
const chips = document.getElementById("chips")
const cards = ships.map((ship) => {
  const el = document.createElement("div")
  el.className = "card"
  el.innerHTML = `<img src="${ship.cover}" alt="">`
  deck.appendChild(el)
  return el
})
const mine = document.createElement("div")
mine.className = "card mine"
mine.innerHTML = `<div><div class="plus">+</div><div class="label">${c.mine}</div></div>`
deck.appendChild(mine)
cards.push(mine)
const chipEls = ships.map((ship) => {
  const el = document.createElement("div")
  el.className = "chip"
  el.innerHTML = `<img src="${ship.avatar}" alt=""><span class="name">${ship.name}</span><span class="handle">@${ship.handle}</span>`
  chips.appendChild(el)
  return el
})
const mineChip = document.createElement("div")
mineChip.className = "chip"
mineChip.innerHTML = `<span class="pin">+</span><span class="name">crafter.run/ships</span>`
chips.appendChild(mineChip)
chipEls.push(mineChip)

const DURATION = 10
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
const TILT = [-3, 4, -7, 6, -4, 5, -6, 3, -2]

// Front card index as a continuous value. Holds on the poster, deals one card at a time,
// lands on the empty "your Ship" card, then the dip at the end returns to the poster.
function front(t) {
  const DEAL_START = 2.4, STEP = 0.66, MOVE = 0.42
  const last = cards.length - 1
  if (t < DEAL_START) return 0
  const local = t - DEAL_START
  const k = Math.floor(local / STEP)
  if (k >= last) return last
  return k + ease(clamp((local - k * STEP) / MOVE))
}

window.render = (t) => {
  t = ((t % DURATION) + DURATION) % DURATION
  const f = front(t)
  cards.forEach((el, i) => {
    const r = i - f
    let x = 0, y = 0, rot = TILT[i % TILT.length], s = 1, o = 1, z = 100 - i
    if (r < 0) {
      const p = clamp(-r)
      x = 380 * ease(p); y = -40 * p; rot += 16 * p; o = 1 - p
      z = 200
    } else {
      x = -r * 16; y = -r * 13; s = 1 - r * 0.045
      o = r > 3 ? clamp(4 - r) : 1
      rot = TILT[i % TILT.length] * clamp(r, 0, 1) * 0.9 + (r < 1 ? TILT[i % TILT.length] * 0.15 * (1 - r) : 0)
    }
    el.style.zIndex = String(Math.round(z))
    el.style.opacity = String(o)
    el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${s})`
  })
  chipEls.forEach((el, i) => {
    const d = Math.abs(i - f)
    const o = clamp(1 - d * 2.2)
    el.style.opacity = String(o)
    el.style.transform = `translateY(${(i - f) * 18}px)`
  })
  // Copy swap when the empty card arrives.
  const swap = ease(clamp((t - 7.55) / 0.5))
  const intro = document.getElementById("intro"), outro = document.getElementById("outro")
  intro.style.opacity = String(1 - swap)
  intro.style.transform = `translateY(${-14 * swap}px)`
  outro.style.opacity = String(swap)
  outro.style.transform = `translateY(${14 * (1 - swap)}px)`
  document.getElementById("footRight").style.opacity = String(1 - swap)
  // Soft dip back to the poster so the loop has no jump.
  const dipOut = clamp((t - 9.35) / 0.3), dipIn = clamp((t - 9.65) / 0.35)
  const content = document.getElementById("content")
  content.style.opacity = String(t >= 9.65 ? ease(dipIn) : 1 - ease(dipOut))
  if (t >= 9.65) { // the poster state underneath the fade-in
    cards.forEach((el, i) => {
      const r = i
      el.style.opacity = String(r > 3 ? clamp(4 - r) : 1)
      el.style.zIndex = String(100 - i)
      el.style.transform = `translate(${-r * 16}px, ${-r * 13}px) rotate(${r === 0 ? TILT[0] * 0.15 : TILT[i % TILT.length] * 0.9}deg) scale(${1 - r * 0.045})`
    })
    chipEls.forEach((el, i) => { el.style.opacity = i === 0 ? "1" : "0"; el.style.transform = `translateY(${i * 18}px)` })
    intro.style.opacity = "1"; intro.style.transform = "none"; outro.style.opacity = "0"
    document.getElementById("footRight").style.opacity = "1"
  }
}

window.ready = Promise.all([
  document.fonts.ready,
  ...[...document.images].map((img) => img.complete ? Promise.resolve() : new Promise((done) => { img.onload = img.onerror = done })),
]).then(() => { window.render(Number(params.get("t") ?? 0)); return true })
</script>
</body>
</html>
