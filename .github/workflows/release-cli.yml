name: Release CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Version or publish @crafter/cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test CLI
        run: bun test packages/cli

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version:cli
          publish: bun run release:cli
          commit: "chore: release @crafter/cli"
          title: "chore: release @crafter/cli"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
